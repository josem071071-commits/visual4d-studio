name: Visual 4D Core External Certification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  certify-core:
    name: Core certification (Node 22 + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visual4d
          POSTGRES_PASSWORD: visual4d_ci_only
          POSTGRES_DB: visual4d_cert
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U visual4d -d visual4d_cert"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      VISUAL4D_TEST_DATABASE_URL: postgresql://visual4d:visual4d_ci_only@127.0.0.1:5432/visual4d_cert
      VISUAL4D_CERTIFICATION_ALLOW_SCHEMA_RESET: "true"
      VISUAL4D_ALLOW_DEV_APPROVAL_GRANTS: "true"
      VISUAL4D_MAX_BODY_BYTES: "65536"
      VISUAL4D_REQUEST_TIMEOUT_MS: "10000"
      VISUAL4D_RATE_LIMIT_PER_MINUTE: "500"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Clean dependency install
        run: npm ci
      - name: Certification environment guard
        run: node scripts/ci-environment-check.mjs
      - name: Production deployment configuration guard
        run: node scripts/validate-production-deploy-config.mjs
      - name: Build core
        run: npm run build:core
      - name: Full typecheck
        run: npm run typecheck
      - name: Build integration targets
        run: npm run build:integration
      - name: Production auth and OAuth scope tests
        run: npm run test:sprint4.6
      - name: Runtime and domain suites
        run: |
          npm run test:core
          npm run test:sprint2
          npm run test:sprint2.1
          npm run test:sprint2.2
          npm run test:sprint2.3
          npm run test:sprint3
          npm run test:sprint3.1
          npm run test:sprint3.2
          npm run test:sprint3.3
          npm run test:sprint3.4
          npm run test:sprint3.5
          npm run test:sprint4.3
          npm run test:migrations
      - name: Authenticated MCP render-preview integration
        run: npm run test:integration:mcp
      - name: Generate Sprint 3 visual references
        run: |
          npm run render:sprint3.1:sample
          npm run render:sprint3.2:sample
          npm run render:sprint3.3:sample
          npm run render:sprint3.4:sample
      - name: PostgreSQL UP/DOWN/UP — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/postgres-migration.test.mjs
      - name: Production schema bootstrap + projects.create — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/production-schema-bootstrap.integration.test.mjs
      - name: Migration 0006 UP/DOWN/UP — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/migration-0006-roundtrip.integration.test.mjs
      - name: Production liveness/readiness separation — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/production-readiness.integration.test.mjs
      - name: Production structured observability — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/production-observability.integration.test.mjs
      - name: PostgreSQL logical backup/restore recovery — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/postgres-backup-restore.integration.test.mjs
      - name: Production multi-user isolation and least privilege — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/production-security-isolation.integration.test.mjs
      - name: Production cross-instance persistence continuity — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/production-cross-instance-continuity.integration.test.mjs
      - name: Approval UI Bridge explicit-click production path — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/approval-ui-bridge.integration.test.mjs
      - name: V4D-SAT complete 11-tool MCP certification — zero skips
        run: npm run test:ci:all-tools-certification
      - name: PostgreSQL + MCP core certification — zero skips
        run: node scripts/run-test-no-skip.mjs tests/integration/core-certification.integration.test.mjs
      - name: Generate certification report
        if: success()
        env:
          CERTIFICATION_STATUS: PASS
        run: node scripts/generate-certification-report.mjs
      - name: Upload certification report and visual references
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visual4d-core-certification-${{ github.sha }}
          path: |
            certification/CORE_EXTERNAL_CERTIFICATION_REPORT.md
            certification/V4D_SAT_PRODUCTION_BASELINE.md
            certification/samples/sprint3_1_reference.svg
            certification/samples/sprint3_2_asset_reference.svg
            certification/samples/sprint3_3_brand_reference.svg
            certification/samples/sprint3_4_service_reference.svg
            certification/samples/sprint3_4_service_reference.json
          if-no-files-found: error
          retention-days: 30
