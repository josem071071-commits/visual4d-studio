name: Visual 4D Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character commit SHA to certify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rc-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Validate candidate input
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ inputs.candidate_sha }}'
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'candidate_sha must be a full 40-character SHA'; exit 1; }
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify immutable candidate identity
        env:
          VISUAL4D_RC_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/validate-release-candidate.mjs
      - name: Validate publication package on exact candidate
        run: npm run validate:publication
      - name: Build core on exact candidate
        run: npm run build
      - name: Typecheck exact candidate
        run: npm run typecheck
      - name: Write RC evidence summary
        shell: bash
        run: |
          {
            echo '## Visual 4D Release Candidate'
            echo ''
            echo '- Candidate SHA: `${{ inputs.candidate_sha }}`'
            echo '- Checkout identity: verified'
            echo '- Publication package: validated'
            echo '- Build: passed'
            echo '- Typecheck: passed'
            echo '- Publication state: fail-closed pending external gates'
            echo ''
            echo 'This workflow proves candidate identity and baseline integrity. Full RC promotion additionally requires the Core, Production Auth, External HTTPS/MCP and Publication Readiness workflows to pass on this exact SHA.'
          } >> "$GITHUB_STEP_SUMMARY"
