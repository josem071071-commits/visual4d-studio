name: Visual 4D Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character commit SHA to certify'
        required: true
        type: string
  push:
    branches:
      - 'rc/**'

permissions:
  contents: read

jobs:
  rc-identity:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: Validate candidate input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'candidate SHA must be a full 40-character SHA'; exit 1; }
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify immutable candidate identity
        env:
          VISUAL4D_RC_SHA: ${{ env.CANDIDATE_SHA }}
        run: node scripts/validate-release-candidate.mjs
      - name: Validate publication package on exact candidate
        run: npm run validate:publication
      - name: Build core on exact candidate
        run: npm run build:core
      - name: Build integration targets on exact candidate
        run: npm run build:integration
      - name: Typecheck exact candidate
        run: npm run typecheck
      - name: Validate production deployment configuration
        run: node scripts/validate-production-deploy-config.mjs
      - name: Write RC evidence summary
        shell: bash
        run: |
          {
            echo '## Visual 4D Release Candidate'
            echo ''
            echo "- Candidate SHA: \`$CANDIDATE_SHA\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo '- Checkout identity: verified'
            echo '- Publication package: validated'
            echo '- Core build: passed'
            echo '- Integration build: passed'
            echo '- Typecheck: passed'
            echo '- Production deploy config: validated'
            echo '- Publication state: fail-closed pending external gates'
            echo ''
            echo 'Full RC promotion additionally requires Core, Production Auth, external HTTPS/MCP, public website and recovery gates to pass on this exact SHA.'
          } >> "$GITHUB_STEP_SUMMARY"
