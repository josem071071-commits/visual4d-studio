name: Visual 4D Sprint 4.2 External HTTPS Certification

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  public-health-and-auth-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Public HTTPS health
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://honest-success-production-6b40.up.railway.app/healthz)"
          echo "$BODY" | grep '"ok":true'
          echo "$BODY" | grep '"service":"visual4d-mcp-local"'

      - name: MCP rejects unauthenticated requests
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --output /tmp/mcp-body --write-out '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            https://honest-success-production-6b40.up.railway.app/mcp)"
          test "$STATUS" = "401"

  authenticated-remote-mcp:
    needs: public-health-and-auth-boundary
    runs-on: ubuntu-latest
    env:
      VISUAL4D_STAGING_AUTH_TOKEN: ${{ secrets.VISUAL4D_STAGING_AUTH_TOKEN }}
      VISUAL4D_STAGING_URL: https://honest-success-production-6b40.up.railway.app/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require staging authentication secret
        run: |
          set -euo pipefail
          test -n "$VISUAL4D_STAGING_AUTH_TOKEN"
      - name: Development approval bridge remains unavailable
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --output /tmp/approval-body --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VISUAL4D_STAGING_AUTH_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"projectId":"none","kind":"ANALYSIS","artifactVersionId":"none"}' \
            https://honest-success-production-6b40.up.railway.app/local/approval-grants)"
          test "$STATUS" = "404"
      - run: npm ci
      - name: Authenticated remote MCP discovery and render
        run: node tests/integration/mcp-remote-smoke.mjs
