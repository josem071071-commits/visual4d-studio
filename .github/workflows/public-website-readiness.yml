name: Visual 4D Public Website Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/validate-public-website.mjs'
      - '.github/workflows/public-website-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/validate-public-website.mjs'
      - '.github/workflows/public-website-readiness.yml'

permissions:
  contents: read

jobs:
  validate-public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public website
        run: node scripts/validate-public-website.mjs
      - name: Confirm custom MCP liveness
        run: curl --fail --silent --show-error https://mcp.visual4dstudio.com/healthz
      - name: Confirm custom MCP readiness
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error https://mcp.visual4dstudio.com/readyz)"
          echo "$body"
          node -e 'const v=JSON.parse(process.argv[1]); if(v.ok!==true||v.migrations!==6||v.tables!==17) process.exit(1)' "$body"
